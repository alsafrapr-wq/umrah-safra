<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج التسجيل</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <select id="langSelect" style="margin-bottom: 20px;">
    <option value="ar">العربية</option>
    <option value="en">English</option>
    <option value="ur">اردو</option>
    <option value="bn">বাংলা</option>
    <option value="hi">हिंदी</option>
  </select>

  <form id="registrationForm">
    
    <div style="margin-bottom: 15px;">
      <label>الاسم الكامل | Full Name | نام | নাম | पूरा नाम | English</label>
      <br>
      <input type="text" name="name" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>رقم الهوية أو الإقامة | ID / Iqama Number</label>
      <br>
      <input type="number" name="id_number" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>رقم الجوال | Phone Number</label>
      <br>
      <input type="tel" name="phone" required style="width: 100%; padding: 8px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>إرفاق صورة الهوية | Upload ID Photo</label>
      <br>
      <input type="file" id="id_photo" accept="image/*" style="width: 100%; padding: 8px;">
    </div>

    <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer;">
      إرسال | Submit
    </button>
  </form>

  <script>
    // رابط السكريبت الخاص بك
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz2_oqB7hAiSUYTdShJuP81Wv8joxr4sDjUdaLiyngt7TvZZe3GqpQx15n_X5lnerp-/exec';
    const form = document.getElementById('registrationForm');

    // نصوص التنبيهات باللغات الخمس
    const alertTexts = {
      ar: { wait: "جاري الإرسال...", success: "تم التسجيل بنجاح!", duplicate: "رقم الهوية أو الإقامة مسجل مسبقاً!", error: "حدث خطأ أثناء التسجيل، حاول مجدداً." },
      en: { wait: "Sending...", success: "Registration successful!", duplicate: "This ID/Iqama is already registered!", error: "An error occurred, please try again." },
      ur: { wait: "بھیجا جا رہا ہے...", success: "رجسٹریشن کامیابی سے مکمل ہو گئی!", duplicate: "یہ شناختی کارڈ یا اقامہ نمبر پہلے سے رجسٹرڈ ہے!", error: "ایک خرابی پیش آ گئی، براہ کرم دوبارہ کوشش کریں۔" },
      bn: { wait: "পাঠানো হচ্ছে...", success: "নিবন্ধন সফলভাবে সম্পন্ন হয়েছে!", duplicate: "এই আইডি বা আকামা নম্বর ইতিমধ্যে নিবন্ধিত!", error: "একটি ত্রুটি ঘটেছে, অনুগ্রহ করে আবার চেষ্টা করুন।" },
      hi: { wait: "भेजा जा रहा है...", success: "पंजीकरण सफलतापूर्वक पूरा हुआ!", duplicate: "यह आईडी या इकामा नंबर पहले से पंजीकृत है!", error: "एक त्रुटि हुई, कृपया पुनः प्रयास करें।" }
    };

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      // تحديد اللغة الحالية المختارة
      const userLang = document.getElementById('langSelect').value || 'ar';
      const texts = alertTexts[userLang] || alertTexts['ar'];

      // إظهار رسالة "جاري الإرسال"
      Swal.fire({
        title: texts.wait,
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      const formData = new FormData(form);
      const fileInput = document.getElementById('id_photo');

      const sendData = (dataToSend) => {
        fetch(scriptURL, { method: 'POST', body: dataToSend })
          .then(response => response.json())
          .then(data => {
            if (data.result === 'success') {
              Swal.fire({ title: texts.success, icon: 'success' });
              form.reset(); // تفريغ الحقول بعد النجاح
            } else if (data.result === 'duplicate') {
              Swal.fire({ title: texts.duplicate, icon: 'error' });
            } else {
              Swal.fire({ title: texts.error, text: data.message, icon: 'error' });
            }
          })
          .catch(error => {
            Swal.fire({ title: texts.error, icon: 'error' });
          });
      };

      // تحويل الصورة إلى Base64 وإرسالها إن وُجدت
      if (fileInput && fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function() {
          // إضافة بيانات الصورة إلى حقول النموذج المرسلة
          formData.append('id_photo', reader.result);
          formData.append('id_photo_type', file.type);
          sendData(formData);
        };
        reader.readAsDataURL(file);
      } else {
        // في حال عدم إرفاق صورة
        sendData(formData);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تسجيل العمرة | Umrah Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #219150; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .lang-selector { text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-selector">
        <select id="languageSelect" onchange="changeLanguage()">
            <option value="ar">العربية (Arabic)</option>
            <option value="en">English</option>
            <option value="ur">اردو (Urdu)</option>
            <option value="bn">বাংলা (Bengali)</option>
            <option value="hi">हिन्दी (Hindi)</option>
        </select>
    </div>

    <h2 id="formTitle">نموذج التسجيل للعمرة</h2>

    <form id="umrahForm">
        <div class="form-group">
            <label id="lblName" for="name">الاسم الرباعي:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label id="lblId" for="id_number">رقم الهوية / الجواز:</label>
            <input type="number" id="id_number" name="id_number" required>
        </div>

        <div class="form-group">
            <label id="lblPhone" for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
            <label id="lblBirth" for="birth_date">تاريخ الميلاد:</label>
            <input type="date" id="birth_date" name="birth_date" required>
        </div>

        <div class="form-group">
            <label id="lblGender" for="gender">الجنس:</label>
            <select id="gender" name="gender" required>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lblNationality" for="nationality">الجنسية:</label>
            <input type="text" id="nationality" name="nationality" required>
        </div>

        <div class="form-group">
            <label id="lblPhoto" for="id_photo">صورة الهوية / الجواز (اختياري):</label>
            <input type="file" id="id_photo" accept="image/png, image/jpeg, image/jpg">
        </div>

        <button type="submit" id="submitBtn">تسجيل البيانات</button>
    </form>
</div>

<script>
    // الرابط المباشر الخاص بك في Google Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzoeXm7mwWx80SY-liZ1Oi_pCnBHS1EWAvLJT9aK7nzZxcaXOwREDM749SsrQ7piA/exec';

    const form = document.getElementById('umrahForm');
    const submitBtn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('id_photo');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // تغيير حالة الزر لمنع الإرسال المتكرر
        submitBtn.disabled = true;
        submitBtn.innerText = "جاري الإرسال... الرجاء الانتظار";

        // تجميع البيانات الأساسية
        const formData = {
            name: document.getElementById('name').value,
            id_number: document.getElementById('id_number').value,
            phone: document.getElementById('phone').value,
            birth_date: document.getElementById('birth_date').value,
            gender: document.getElementById('gender').value,
            nationality: document.getElementById('nationality').value,
            id_photo: "",
            id_photo_type: ""
        };

        // معالجة الصورة إذا قام المستخدم برفعها
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            formData.id_photo_type = file.type;
            
            try {
                formData.id_photo = await getBase64(file);
            } catch (error) {
                alert("حدث خطأ أثناء معالجة الصورة. حاول مرة أخرى.");
                resetButton();
                return;
            }
        }

        // إرسال البيانات إلى جوجل شيت
        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData),
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.result === 'success') {
                alert('تم التسجيل وحفظ البيانات بنجاح!');
                form.reset(); // تفريغ الحقول بعد النجاح
            } else if (data.result === 'duplicate') {
                alert('عذراً، رقم الهوية مسجل مسبقاً في النظام.');
            } else {
                alert('حدث خطأ: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('حدث خطأ في الاتصال. يرجى التأكد من اتصالك بالإنترنت.');
        })
        .finally(() => {
            resetButton();
        });
    });

    // دالة مساعدة لتحويل الصورة إلى Base64
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // دالة لإعادة الزر لحالته الطبيعية
    function resetButton() {
        submitBtn.disabled = false;
        submitBtn.innerText = "تسجيل البيانات";
    }

    // هيكل مبسط لتغيير النصوص حسب اللغة المختارة
    function changeLanguage() {
        const lang = document.getElementById('languageSelect').value;
        const isRtl = (lang === 'ar' || lang === 'ur');
        document.documentElement.dir = isRtl ? "rtl" : "ltr";
        
        // يمكنك لاحقاً إضافة قاموس نصوص هنا لتحديث العناوين (lblName, lblId, وغيرها)
        // مثال: if(lang === 'en') document.getElementById('lblName').innerText = "Full Name:";
